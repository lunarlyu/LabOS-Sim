# Default run parameters. CLI flags override these. The runner snapshots the
# resolved config into each run dir as run_config.json for reproducibility.

dataset:
  metadata_path: metadata/real_human_samples_no_multiple.json
  data_root: data/real_human

media:
  input_type: video            # video | image_contact_sheet
  camera_views: []             # [] = all views
  max_videos_per_sample: 0     # 0 = all
  max_total_video_mb_per_request: 250
  transcode:
    enabled: true
    max_width: 1080
    fps: 30
    crf: 28
    preset: veryfast

call:
  max_retries: 5
  timeout_seconds: 180
  max_completion_tokens: 1400
