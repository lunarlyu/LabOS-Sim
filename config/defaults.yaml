# Default run parameters. CLI flags override these. The runner snapshots the
# resolved config into each run dir as run_config.json for reproducibility.
# (Which datapoints to run comes from --data run_list.jsonl, not from here.)

media:
  input_type: image_frames      # full evaluation uses independent JPEG frames
  camera_views: [front, left, right]  # fixed full-eval views; CLI may override
  max_videos_per_sample: 0     # 0 = all
  fairness_profile: canonical_clip_1080px_30fps
  preprocess:                  # media.py reads media.preprocess.* for the selected input type
    transcode:
      enabled: true
      max_width: 1080
      fps: 30
      crf: 28
      preset: veryfast
    contact_sheet:
      max_width: 720
      fps: 1
      columns: 4
      rows: 8
      # Shared payload-safe setting for base64 image APIs such as OpenRouter.
      # q=3 produced >25 MB multi-view requests and HTTP 413 failures.
      quality: 10
    frames:
      frame_count: 128
      max_width: 720
      quality: 10

call:
  max_retries: 5
  timeout_seconds: 180
  max_completion_tokens: 2048
