experiment: vlm_design_choices
sample_manifest: design_justification/design_choices_experiment/selected_samples_10_per_type.csv
sampling_seed: 20260711
samples_per_type: 10
sample_count: 80

fixed:
  model: gemini_3_1_pro
  provider_model_id: google/gemini-3.1-pro-preview
  prompts: [p1_closed_binary, p2_multilabel_classification, p3_open_detection_strict]
  p3_parser: p5_open_detection_strict_parser
  parser_model: gpt_5_5_parser
  temperature: 0
  retry_after_failure: true
  max_retries_after_initial_call: 5

stages:
  contact_sheet:
    status: historical_complete
    camera_views: [front, gripper]
    conditions:
      baseline: {frames_per_view: 128, max_completion_tokens: 2048, max_width_px: 720}
      frames_256: {frames_per_view: 256, max_completion_tokens: 2048, max_width_px: 720}
      tokens_4096: {frames_per_view: 128, max_completion_tokens: 4096, max_width_px: 720}
      resolution_480: {frames_per_view: 128, max_completion_tokens: 2048, max_width_px: 480}

  independent_frames:
    status: final_transport
    camera_views: [front, left, right]
    jpeg_quality: 10
    conditions:
      baseline: {frames_per_view: 128, max_completion_tokens: 2048, max_width_px: 720}
      fixed_256: {frames_per_view: 256, max_completion_tokens: 2048, max_width_px: 720}
      adaptive_256: {frame_cap_per_view: 256, max_completion_tokens: 2048, max_width_px: 720}
      resolution_480: {frames_per_view: 128, max_completion_tokens: 2048, max_width_px: 480}

  frame_budget_bridge:
    status: complete_2026_08_08
    rationale: field norms are ~1 fps (Video-MME, Gemini native) to 2-4 fps
      (OpenAI guidance); 128/view on 4-21s clips is 6-30 fps effective. If 32
      holds, roster cost /4 and Claude's per-request image cap fits 3 views.
    conditions:
      frames_64: {frames_per_view: 64, camera_views: [front, left, right], max_completion_tokens: 2048, max_width_px: 720}
      frames_32: {frames_per_view: 32, camera_views: [front, left, right], max_completion_tokens: 2048, max_width_px: 720}
    baseline_run: gemini31pro_multiframe_design_02_baseline_f128_views3_tok2048_res720

  view_ablation:
    status: complete_2026_08_07
    jpeg_quality: 10
    rationale: input cost scales linearly with view count; a smaller view set
      also eases per-request image caps for the multi-model roster
      (docs/MODEL_ROSTER_AND_BUDGET.md). View selection was fixed in the stages
      above and never tested under independent frames.
    conditions:
      views_front_left: {frames_per_view: 128, camera_views: [front, left], max_completion_tokens: 2048, max_width_px: 720}
      views_front_only: {frames_per_view: 128, camera_views: [front], max_completion_tokens: 2048, max_width_px: 720}
    baseline_run: gemini31pro_multiframe_design_02_baseline_f128_views3_tok2048_res720

selected_design:
  input_type: image_frames
  frames_per_view: 128
  camera_views: [front, left, right]
  max_completion_tokens: 2048
  max_width_px: 720
